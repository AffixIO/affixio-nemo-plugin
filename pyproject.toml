[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "affixio-nemo-plugin"
version = "0.1.0"
description = "AffixIO API guard middleware for NVIDIA NeMo Agent Toolkit tool execution."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "AffixIO" }]
maintainers = [{ name = "AffixIO" }]
keywords = [
  "affixio",
  "nemo-agent-toolkit",
  "nvidia",
  "agent-toolkit",
  "tool-guard",
  "agent-authorization",
  "agent-safety",
  "api-gateway",
  "agentic-ai"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed"
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3"
]

[project.optional-dependencies]
nemo = ["nvidia-nat-core>=1.5,<2"]
dev = ["build>=1.2", "pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.6", "twine>=5.1"]

[project.urls]
Homepage = "https://www.affix-io.com/"
Documentation = "https://www.affix-io.com/docs/"
Source = "https://github.com/AffixIO/affixio-nemo-plugin"
Issues = "https://github.com/AffixIO/affixio-nemo-plugin/issues"
API = "https://api.affix-io.com/v1/sdk2/capabilities"

[project.entry-points."nat.plugins"]
affixio_nemo = "affixio_nemo.register"

[tool.hatch.build]
include = [
  "affixio_nemo/**/*.py",
  "affixio_nemo/py.typed",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "examples/workflow.yml"
]

[tool.hatch.build.targets.wheel]
packages = ["affixio_nemo"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["affixio_nemo", "tests"]

[tool.hatch.build.targets.wheel.force-include]
"affixio_nemo/py.typed" = "affixio_nemo/py.typed"
